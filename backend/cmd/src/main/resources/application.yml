spring:
  application:
    name: cmd
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cmd}
    username: ${DB_USER:cmd}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    # Sin MAIL_HOST no se envían correos: los enlaces se escriben en el log (útil en desarrollo).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # La API vive detrás del servidor del frontend, que reenvía el host y el protocolo originales.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 12h
      cookie:
        name: CMD_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  # URL pública del sitio; se usa en los enlaces de los correos y al volver del login social.
  base-url: ${APP_BASE_URL:http://localhost:4200}
  admin:
    # Solo se usan en el primer arranque, cuando aún no existe ningún administrador.
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@monkeycoffedevs.local}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
  # Un proveedor se activa solo si tiene client-id; el frontend muestra únicamente los activos.
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    discord:
      client-id: ${DISCORD_CLIENT_ID:}
      client-secret: ${DISCORD_CLIENT_SECRET:}
